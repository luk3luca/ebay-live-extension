<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>eBay Live Clean</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h1>eBay Live Clean</h1>
    <p class="subtitle">Layout pulito per eBay Live</p>

    <label class="row">
      <span class="label">Attiva layout pulito</span>
      <span class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="row col">
      <span class="label">Larghezza colonna laterale: <b id="wval">360px</b></span>
      <input type="range" id="width" min="280" max="480" step="10" value="360">
    </label>

    <p class="hint" id="hint">
      ON: video verticale a piena altezza senza crop, chat e oggetti
      in una colonna a destra, header nascosto.<br>
      OFF: eBay Live visualizzato normalmente.
    </p>

    <p class="status" id="status">Pronto</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
