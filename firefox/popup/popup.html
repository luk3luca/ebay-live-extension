<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eBay Live Clean</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h1>eBay Live Clean</h1>
    <p class="subtitle">Clean layout for eBay Live</p>

    <label class="row">
      <span class="label">Clean layout</span>
      <span class="switch">
        <input type="checkbox" id="toggle" checked>
        <span class="slider"></span>
      </span>
    </label>

    <label class="row col">
      <span class="label">Sidebar width: <b id="wval">360px</b></span>
      <input type="range" id="width" min="280" max="480" step="10" value="360">
    </label>

    <p class="hint" id="hint">
      ON: full-height vertical video with no cropping, chat and items
      in a right-hand column, headers hidden.<br>
      OFF: eBay Live shown as usual.
    </p>

    <p class="status" id="status">Ready</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
